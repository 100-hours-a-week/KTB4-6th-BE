spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: false
    show-sql: false

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}

jwt:
  secret: ${JWT_SECRET}

credit:
  max-balance: ${CREDIT_MAX_BALANCE:1000}
  team-create-grant: ${CREDIT_TEAM_CREATE_GRANT:200}
  weekly-grant: ${CREDIT_WEEKLY_GRANT:200}
  weekly-grant-cron: "${CREDIT_WEEKLY_GRANT_CRON:0 0 0 * * MON}"
  recording-cost: ${CREDIT_RECORDING_COST:20}
  summary-regenerate-cost: ${CREDIT_SUMMARY_REGENERATE_COST:3}
  ai-chat-message-cost: ${CREDIT_AI_CHAT_MESSAGE_COST:1}
  analysis-report-cost: ${CREDIT_ANALYSIS_REPORT_COST:5}

meeting:
  daily-create-limit: ${MEETING_DAILY_CREATE_LIMIT:5}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

ai:
  websocket-url: ${AI_WEBSOCKET_URL}
  http-url: ${AI_HTTP_URL}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
