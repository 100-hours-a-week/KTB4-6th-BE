spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}

jwt:
  secret: ${JWT_SECRET}

credit:
  max-balance: 1000
  team-create-grant: 200
  weekly-grant: 200
  weekly-grant-cron: "0 0 0 * * MON"
  recording-cost: 20
  summary-regenerate-cost: 3
  ai-chat-message-cost: 1
  analysis-report-cost: 5

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

ai:
  websocket-url: ${AI_WEBSOCKET_URL}
  http-url: ${AI_HTTP_URL}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION}
