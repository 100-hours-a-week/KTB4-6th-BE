spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/api/auth/kakao/callback}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:meety}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:meety}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

kakao:
  admin-key: ${KAKAO_ADMIN_KEY:local-kakao-admin-key}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-meety-32bytes!!}

credit:
  max-balance: 1000
  team-create-grant: 200
  weekly-grant: 200
  weekly-grant-cron: "0 0 0 * * MON"
  recording-cost: 20
  summary-regenerate-cost: 3
  ai-chat-message-cost: 1
  analysis-report-cost: 5

meeting:
  daily-create-limit: ${MEETING_DAILY_CREATE_LIMIT:5}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

ai:
  websocket-url: ${AI_WEBSOCKET_URL:ws://localhost:8000/v1/live-meeting}
  http-url: ${AI_HTTP_URL:http://localhost:8001}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:meety-local}
    region: ${AWS_S3_REGION:us-east-2}

logging:
  level:
    com.backend.meety.domain.recording.realtime: DEBUG
