spring:
  application:
    name: meety
  jpa:
    open-in-view: false
  task:
    scheduling:
      pool:
        size: 2
  security:
    oauth2:
      client:
        registration:
          kakao:
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

kakao:
  unlink-uri: https://kapi.kakao.com/v1/user/unlink

jwt:
  access-token-validity: 30m
  refresh-token-validity: 14d

notification:
  executor:
    core-pool-size: "${NOTIFICATION_EXECUTOR_CORE_POOL_SIZE:${NOTIFICATION_EXECUTOR_WORKER:8}}"
    max-pool-size: "${NOTIFICATION_EXECUTOR_MAX_POOL_SIZE:${NOTIFICATION_EXECUTOR_WORKER:8}}"
    queue-capacity: "${NOTIFICATION_EXECUTOR_QUEUE_CAPACITY:100}"

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
  send-default-pii: ${SENTRY_SEND_DEFAULT_PII:false}
  logs:
    enabled: ${BE_SENTRY_LOGS_ENABLED:false}
  traces-sample-rate: ${BE_SENTRY_TRACES_SAMPLE_RATE:0.0}
  profile-session-sample-rate: ${SENTRY_PROFILE_SESSION_SAMPLE_RATE:0.0}
  profile-lifecycle: ${SENTRY_PROFILE_LIFECYCLE:TRACE}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
