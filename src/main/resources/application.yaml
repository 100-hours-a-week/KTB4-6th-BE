spring:
  application:
    name: meety
  jpa:
    open-in-view: false
  task:
    scheduling:
      pool:
        size: 2
  security:
    oauth2:
      client:
        registration:
          kakao:
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

kakao:
  unlink-uri: https://kapi.kakao.com/v1/user/unlink

auth:
  access-token-cookie-name: ${AUTH_ACCESS_TOKEN_COOKIE_NAME:accessToken}

jwt:
  access-token-validity: 30m
  refresh-token-validity: 14d

notification:
  executor:
    core-pool-size: ${NOTIFICATION_EXECUTOR_CORE_POOL_SIZE:4}
    max-pool-size: ${NOTIFICATION_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${NOTIFICATION_EXECUTOR_QUEUE_CAPACITY:100}

recording:
  owner:
    ttl: ${RECORDING_OWNER_TTL:30s}
    heartbeat-interval: ${RECORDING_OWNER_HEARTBEAT_INTERVAL:10s}
  sequence:
    ttl: ${RECORDING_SEQUENCE_TTL:90m}

meeting-sse:
  # Initial isolation defaults, not load-tested sizing: workers/queue follow the existing notification executor.
  executor:
    core-pool-size: ${MEETING_SSE_EXECUTOR_CORE_POOL_SIZE:4}
    max-pool-size: ${MEETING_SSE_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${MEETING_SSE_EXECUTOR_QUEUE_CAPACITY:100}
    shutdown-await-seconds: ${MEETING_SSE_EXECUTOR_SHUTDOWN_AWAIT_SECONDS:10}
  queue:
    max-pending-per-meeting: ${MEETING_SSE_MAX_PENDING_PER_MEETING:100}
    max-pending-total: ${MEETING_SSE_MAX_PENDING_TOTAL:1000}

transcript-save:
  max-pending-per-recording: ${TRANSCRIPT_SAVE_MAX_PENDING_PER_RECORDING:500}
  max-pending-total: ${TRANSCRIPT_SAVE_MAX_PENDING_TOTAL:5000}
  retry-initial-backoff: ${TRANSCRIPT_SAVE_RETRY_INITIAL_BACKOFF:1s}
  retry-max-duration: ${TRANSCRIPT_SAVE_RETRY_MAX_DURATION:60s}
  executor:
    core-pool-size: ${TRANSCRIPT_SAVE_EXECUTOR_CORE_POOL_SIZE:4}
    max-pool-size: ${TRANSCRIPT_SAVE_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${TRANSCRIPT_SAVE_EXECUTOR_QUEUE_CAPACITY:100}
    shutdown-await-seconds: ${TRANSCRIPT_SAVE_EXECUTOR_SHUTDOWN_AWAIT_SECONDS:20}

chat:
  executor:
    core-pool-size: ${CHAT_EXECUTOR_CORE_POOL_SIZE:8}
    max-pool-size: ${CHAT_EXECUTOR_MAX_POOL_SIZE:8}
    queue-capacity: ${CHAT_EXECUTOR_QUEUE_CAPACITY:1000}

ai:
  recovery:
    max-attempts: ${AI_RECOVERY_MAX_ATTEMPTS:2}
    attempt-timeout: ${AI_RECOVERY_ATTEMPT_TIMEOUT:5s}
    success-ack-chunks: ${AI_RECOVERY_SUCCESS_ACK_CHUNKS:10}
    workers: ${AI_RECOVERY_WORKERS:2}
    queue-capacity: ${AI_RECOVERY_QUEUE_CAPACITY:64}
  heartbeat:
    interval: ${AI_HEARTBEAT_INTERVAL:5s}
    pong-timeout: ${AI_HEARTBEAT_PONG_TIMEOUT:5s}
    failure-threshold: ${AI_HEARTBEAT_FAILURE_THRESHOLD:2}
  audio-ack:
    timeout: ${AI_AUDIO_ACK_TIMEOUT:5s}
    poll-delay: ${AI_AUDIO_ACK_POLL_DELAY:1s}
    max-pending-chunks: ${AI_AUDIO_ACK_MAX_PENDING_CHUNKS:1024}
  request:
    recovery:
      processing-timeout: ${AI_REQUEST_PROCESSING_TIMEOUT:70m}
      poll-delay: ${AI_REQUEST_RECOVERY_POLL_DELAY:1m}
      batch-size: ${AI_REQUEST_RECOVERY_BATCH_SIZE:100}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
  send-default-pii: ${SENTRY_SEND_DEFAULT_PII:false}
  logs:
    enabled: ${BE_SENTRY_LOGS_ENABLED:false}
  traces-sample-rate: ${BE_SENTRY_TRACES_SAMPLE_RATE:0.0}
  profile-session-sample-rate: ${SENTRY_PROFILE_SESSION_SAMPLE_RATE:0.0}
  profile-lifecycle: ${SENTRY_PROFILE_LIFECYCLE:TRACE}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
