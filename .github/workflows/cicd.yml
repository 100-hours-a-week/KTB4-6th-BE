name: BE CI/CD

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/meety-be
  AWS_REGION: us-east-2

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: meety
          MYSQL_DATABASE: meety
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: ./gradlew test --no-daemon

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: ./gradlew build -x test --no-daemon

  docker-build:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      # 전체 커밋 SHA를 이미지 태그로 사용해 배포 버전을 정확히 식별한다.
      - id: tag
        run: echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check-migration-label:
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_migration: ${{ steps.check.outputs.is_migration }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            // 스테이징에는 운영 DB 마이그레이션 승인 절차를 적용하지 않는다.
            if (context.ref !== 'refs/heads/main') {
              core.setOutput('is_migration', 'false');
              return;
            }

            const label = '📊 migration';
            const { owner, repo } = context.repo;
            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: context.sha,
              });

            let hasLabel = prs.some(pr =>
              pr.labels.some(item => item.name === label)
            );

            // 연결된 PR이 없을 때는 기존 커밋 메시지 방식으로 다시 찾는다.
            if (prs.length === 0) {
              const message = context.payload.head_commit?.message ?? '';
              const match = message.match(/\(#(\d+)\)/);
              if (match) {
                const { data: pr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: Number(match[1]),
                });
                hasLabel = pr.labels.some(item => item.name === label);
              }
            }

            core.setOutput('is_migration', String(hasLabel));

  deploy:
    needs: [docker-build, check-migration-label]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # dev는 staging, main은 production으로 배포한다.
    # main의 migration 라벨 PR은 별도 승인 환경에서 대기한다.
    environment:
      name: ${{ github.ref_name == 'dev' && 'staging' || (needs.check-migration-label.outputs.is_migration == 'true' && 'production-migration-approval' || 'production') }}

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: deploy-backend-${{ github.ref_name }}
      cancel-in-progress: false

    env:
      IMAGE_TAG: ${{ needs.docker-build.outputs.image_tag }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      INSTANCE_ID: ${{ secrets.APP_INSTANCE_ID }}
      DEPLOY_DIR: ${{ secrets.APP_DEPLOY_DIR }}

    steps:
      - name: 배포 설정 확인
        run: |
          [ -n "$AWS_ROLE_ARN" ] || { echo "::error::AWS_ROLE_ARN 누락"; exit 1; }
          [ -n "$INSTANCE_ID" ] || { echo "::error::APP_INSTANCE_ID 누락"; exit 1; }
          [ -n "$DEPLOY_DIR" ] || { echo "::error::APP_DEPLOY_DIR 누락"; exit 1; }

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-be-deploy-${{ github.run_id }}
          role-skip-session-tagging: true

      - name: SSM 배포 명령 전송
        id: send
        run: |
          # DEPLOY_DIR과 IMAGE_TAG는 선택된 GitHub Environment와 빌드 결과에서 가져온다.
          cat > remote.sh <<EOF
          #!/bin/bash
          set -euo pipefail
          cd "${DEPLOY_DIR}"

          # Compose가 다음 실행에서도 같은 이미지 태그를 사용하도록 기록한다.
          if grep -q '^BE_IMAGE_TAG=' .env; then
            sed -i "s|^BE_IMAGE_TAG=.*|BE_IMAGE_TAG=${IMAGE_TAG}|" .env
          else
            echo "BE_IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi

          # BE 서비스만 갱신하고 Compose의 대기 결과를 배포 성공 기준으로 사용한다.
          docker compose pull backend
          docker compose up -d --no-deps --wait --wait-timeout 180 backend
          docker image prune -f
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy backend ${IMAGE_TAG} (run ${{ github.run_id }})" \
            --timeout-seconds 60 \
            --parameters "$(jq -Rs '{commands: split("\n"), executionTimeout: ["600"]}' remote.sh)" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: SSM 실행 결과 대기
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          STATUS="Pending"
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          # 실패 시 원인을 Actions 로그에서 확인할 수 있도록 서버 출력을 남긴다.
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text || true
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text || true

          echo "최종 상태: $STATUS"
          [ "$STATUS" = "Success" ] || {
            echo "::error::SSM 배포 실패 (status=$STATUS)"
            exit 1
          }

  notify-failure:
    needs: [test, build, docker-build, check-migration-label, deploy]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Discord 실패 알림
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 웹훅이 설정된 경우에만 알림을 보낸다.
          [ -n "$WEBHOOK_URL" ] || exit 0
          jq -n \
            --arg repo "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg url "$RUN_URL" \
            '{content: ("❌ [BE CI/CD 실패] " + $repo + "\nBranch: " + $branch + "\n" + $url)}' \
            | curl --fail --silent --show-error \
                -H "Content-Type: application/json" \
                --data-binary @- "$WEBHOOK_URL"