name: BE 테스트·빌드 및 배포

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/meety-be
  # CI에서 생성하는 JAR와 런타임 agent의 Sentry 버전을 일치시킨다.
  BE_SENTRY_VERSION: 8.59.0

jobs:
  docker-build:
    name: BE 테스트·빌드 및 이미지 게시
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      # 테스트를 통과한 JAR를 담은 이미지를 digest로 고정해 배포한다.
      image_digest: ${{ steps.build.outputs.digest }}
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: meety
          MYSQL_DATABASE: meety
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      # local 프로필의 localhost:6379에 테스트 전용 Redis를 제공한다.
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4
      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Gradle 테스트 및 실행 JAR 생성
        run: |
          # 기존 Docker 빌드와 같은 SDK 버전으로 테스트와 패키징을 한 번에 수행한다.
          cat > "$RUNNER_TEMP/sentry-sdk-version.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              project.pluginManager.withPlugin("io.sentry.jvm.gradle") {
                  project.extensions.getByName("sentry").autoInstallation.sentryVersion.set(System.getenv("BE_SENTRY_VERSION"))
              }
          }
          GRADLE
          ./gradlew --init-script "$RUNNER_TEMP/sentry-sdk-version.init.gradle" test bootJar --no-daemon

          # CI 전용 경로에 이번 실행에서 만든 JAR 하나만 전달한다.
          JARS=(build/libs/*.jar)
          [ "${#JARS[@]}" -eq 1 ] && [ -f "${JARS[0]}" ] || {
            echo "::error::실행 JAR가 정확히 하나여야 합니다"; exit 1;
          }
          mkdir -p build/ci
          cp "${JARS[0]}" build/ci/app.jar

      # 전체 커밋 SHA를 이미지 태그로 사용해 배포 버전을 정확히 식별한다.
      - name: 이미지 태그 생성
        id: tag
        run: echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: BE 이미지 빌드 및 게시
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # CI에서 이미 검증한 JAR를 사용하며 Docker 안에서 다시 컴파일하지 않는다.
          target: ci-runtime
          build-args: |
            SENTRY_SDK_VERSION=${{ env.BE_SENTRY_VERSION }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check-migration-label:
    name: 운영 DB 마이그레이션 라벨 확인
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_migration: ${{ steps.check.outputs.is_migration }}
      v2_migration: ${{ steps.check.outputs.v2_migration }}
    steps:
      - name: PR 마이그레이션 라벨 확인
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const label = '📊 migration';
            const { owner, repo } = context.repo;
            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: context.sha,
              });

            let hasLabel = prs.some(pr =>
              pr.labels.some(item => item.name === label)
            );

            // 연결된 PR이 없을 때는 기존 커밋 메시지 방식으로 다시 찾는다.
            if (prs.length === 0) {
              const message = context.payload.head_commit?.message ?? '';
              const match = message.match(/\(#(\d+)\)/);
              if (match) {
                const { data: pr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: Number(match[1]),
                });
                hasLabel = pr.labels.some(item => item.name === label);
              }
            }

            // main은 운영, dev는 V2 staging의 마이그레이션 승인 여부를 판단한다.
            core.setOutput('is_migration', String(context.ref === 'refs/heads/main' && hasLabel));
            // V2 staging은 dev에서도 라벨이 있으면 승인 후 배포한다.
            core.setOutput('v2_migration', String(hasLabel));

  deploy:
    name: BE V2 prod ECS 배포
    needs: [docker-build, check-migration-label]
    # main 브랜치의 자동 배포 대상은 V2 prod로 고정한다.
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # migration 라벨 PR은 승인 환경에서 대기한다. 승인 전에 prod DB 스키마를 먼저 맞춘다.
    environment:
      name: ${{ needs.check-migration-label.outputs.is_migration == 'true' && 'production-migration-approval' || 'production' }}

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: deploy-backend-v2-prod
      cancel-in-progress: false

    env:
      AWS_REGION: ap-northeast-2
      CLUSTER: meety-v2-prod
      REALTIME_SERVICE: meety-v2-prod-be-realtime
      API_SERVICE: meety-v2-prod-be-api
      # Terraform이 관리하는 태스크 정의. 이 정의에서 이미지만 바꿔 등록한다.
      TEMPLATE_PARAM: /meety/prod/be/deploy/TASK_TEMPLATE_ARN
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/meety-be@${{ needs.docker-build.outputs.image_digest }}
      # DNS 전환 전에도 서울 ALB로 연결하며 Host와 TLS 검증은 운영 도메인을 사용한다.
      ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
      HEALTH_URL: https://api.meety.io.kr/actuator/health

    steps:
      - name: 배포 설정 확인
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}
        run: |
          echo "::notice::BE V2 prod 배포 대상: image=${IMAGE}"
          [ -n "$AWS_ROLE_ARN" ] || { echo "::error::AWS_ROLE_ARN 누락"; exit 1; }
          [[ "$ALB_DNS_NAME" =~ ^[a-zA-Z0-9.-]+\.elb\.amazonaws\.com$ ]] || { echo "::error::서울 ALB_DNS_NAME 설정 필요"; exit 1; }
          [ -n "$IMAGE_DIGEST" ] || { echo "::error::이미지 digest 누락"; exit 1; }

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-be-v2-deploy-${{ github.run_id }}
          role-skip-session-tagging: true

      # CI/CD는 인프라의 태스크 수를 바꾸지 않는다. DB 이전 후 prod 서비스를 먼저 활성화해야 한다.
      - name: prod 서비스 활성화 확인
        run: |
          for svc in "$REALTIME_SERVICE" "$API_SERVICE"; do
            COUNT=$(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
              --query 'services[0].desiredCount' --output text)
            [[ "$COUNT" =~ ^[0-9]+$ ]] && [ "$COUNT" -gt 0 ] || {
              echo "::error::${svc}가 비활성 상태입니다. DB 이전 후 be_services_enabled를 먼저 확인하세요"
              exit 1
            }
          done

      - name: 새 태스크 정의 등록
        id: register
        run: |
          TEMPLATE=$(aws ssm get-parameter --name "$TEMPLATE_PARAM" --query Parameter.Value --output text)
          echo "기준 태스크 정의: ${TEMPLATE##*/}"

          # 이미지만 바꾸고, 등록할 때 쓸 수 없는 조회 전용 필드는 뺀다.
          aws ecs describe-task-definition --task-definition "$TEMPLATE" --query taskDefinition --output json \
            | jq --arg image "$IMAGE" --arg sha "$GITHUB_SHA" '
                .containerDefinitions |= map(if .name == "be" then .image = $image else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)
                | .tags = [
                    {key: "Service", value: "meety"},
                    {key: "Project", value: "meety"},
                    {key: "Version", value: "v2"},
                    {key: "Env", value: "prod"},
                    {key: "ManagedBy", value: "github-actions"},
                    {key: "GitSha", value: $sha}
                  ]' > task-definition.json

          ARN=$(aws ecs register-task-definition --cli-input-json file://task-definition.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "task_definition=$ARN" >> "$GITHUB_OUTPUT"
          echo "::notice::새 태스크 정의: ${ARN##*/}"

      - name: 배포 대기 스크립트 준비
        run: |
          # 서비스 배포를 시작하고, 끝날 조건이 될 때까지 상태를 확인한다.
          # 사용법: deploy.sh <서비스> <태스크 정의> <성공으로 볼 단계(공백 구분)>
          cat > "$RUNNER_TEMP/deploy.sh" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          SERVICE=$1 TASK_DEFINITION=$2 DONE_STAGES=$3
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$TASK_DEFINITION" > /dev/null

          # 이번 update-service로 생긴 배포를 찾는다.
          DEPLOYMENT=""
          for i in $(seq 1 30); do
            DEPLOYMENT=$(aws ecs list-service-deployments --cluster "$CLUSTER" --service "$SERVICE" \
              --created-at "after=$STARTED" --query 'serviceDeployments[0].serviceDeploymentArn' --output text)
            [ "$DEPLOYMENT" != "None" ] && [ -n "$DEPLOYMENT" ] && break
            sleep 5
          done
          [ "$DEPLOYMENT" != "None" ] && [ -n "$DEPLOYMENT" ] || { echo "::error::${SERVICE} 배포를 찾지 못함"; exit 1; }
          echo "${SERVICE} 배포: ${DEPLOYMENT##*/}"

          LAST=""
          while :; do
            read -r STATUS STAGE < <(aws ecs describe-service-deployments --service-deployment-arns "$DEPLOYMENT" \
              --query 'serviceDeployments[0].[status, lifecycleStage]' --output text)
            [ "$STATUS $STAGE" != "$LAST" ] && { echo "$(date +%T) ${SERVICE}: ${STATUS} ${STAGE}"; LAST="$STATUS $STAGE"; }
            case "$STATUS" in
              SUCCESSFUL) exit 0 ;;
              FAILED|STOPPED|STOP_REQUESTED|ROLLBACK_*)
                echo "::error::${SERVICE} 배포 실패 (${STATUS}). ECS가 이전 버전으로 되돌린다"; exit 1 ;;
            esac
            for done_stage in $DONE_STAGES; do
              [ "$STAGE" = "$done_stage" ] && exit 0
            done
            sleep 10
          done
          EOF
          chmod +x "$RUNNER_TEMP/deploy.sh"

      # 같은 job의 배포 잠금을 유지하면서 두 서비스를 동시에 배포한다.
      # prod realtime은 관찰과 정리까지, API는 롤링 배포 완료까지 기다린다.
      - name: prod realtime 및 API 병렬 배포
        run: |
          "$RUNNER_TEMP/deploy.sh" "$REALTIME_SERVICE" "${{ steps.register.outputs.task_definition }}" "" &
          REALTIME_PID=$!
          "$RUNNER_TEMP/deploy.sh" "$API_SERVICE" "${{ steps.register.outputs.task_definition }}" "" &
          API_PID=$!

          # 한쪽이 실패해도 다른 서비스의 배포 결과까지 확인한다.
          # 각 서비스는 기존 ECS 롤백 정책을 따른다.
          RESULT=0
          if wait "$REALTIME_PID"; then
            echo "${REALTIME_SERVICE} 배포 완료 (관찰 및 정리 포함)"
          else
            echo "::error::${REALTIME_SERVICE} 배포 실패"; RESULT=1
          fi
          if wait "$API_PID"; then
            echo "${API_SERVICE} 롤링 배포 완료"
          else
            echo "::error::${API_SERVICE} 배포 실패"; RESULT=1
          fi
          exit "$RESULT"

      - name: 배포 결과 확인
        # 한쪽이 실패했을 때도 두 서비스의 최종 상태를 로그에 남긴다.
        if: ${{ !cancelled() && steps.register.outcome == 'success' }}
        run: |
          for svc in "$REALTIME_SERVICE" "$API_SERVICE"; do
            echo "$svc: $(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
              --query 'services[0].[runningCount, desiredCount]' --output text)"
          done
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            --connect-to "api.meety.io.kr:443:${ALB_DNS_NAME}:443" "$HEALTH_URL")
          echo "be-api health: $CODE"
          [ "$CODE" = "200" ] || { echo "::error::be-api health 실패 ($CODE)"; exit 1; }

  deploy-v2-staging:
    name: BE V2 staging ECS 배포
    needs: [docker-build, check-migration-label]
    # dev 브랜치의 자동 배포 대상은 V2 staging으로 고정한다.
    if: ${{ github.ref_name == 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # migration 라벨 PR은 승인 환경에서 대기한다. 승인 전에 staging DB 스키마를 먼저 맞춘다.
    environment:
      name: ${{ needs.check-migration-label.outputs.v2_migration == 'true' && 'v2-staging-migration-approval' || 'v2-staging' }}

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: deploy-backend-v2-staging
      cancel-in-progress: false

    env:
      AWS_REGION: ap-northeast-2
      CLUSTER: meety-v2-staging
      REALTIME_SERVICE: meety-v2-staging-be-realtime
      API_SERVICE: meety-v2-staging-be-api
      # Terraform이 관리하는 태스크 정의. 이 정의에서 이미지만 바꿔 등록한다.
      TEMPLATE_PARAM: /meety/staging/be/deploy/TASK_TEMPLATE_ARN
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/meety-be@${{ needs.docker-build.outputs.image_digest }}
      HEALTH_URL: https://api-staging.meety.io.kr/actuator/health

    steps:
      - name: 배포 설정 확인
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}
        run: |
          echo "::notice::BE V2 staging 배포 대상: image=${IMAGE}"
          [ -n "$AWS_ROLE_ARN" ] || { echo "::error::AWS_ROLE_ARN 누락"; exit 1; }
          [ -n "$IMAGE_DIGEST" ] || { echo "::error::이미지 digest 누락"; exit 1; }

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-be-v2-deploy-${{ github.run_id }}
          role-skip-session-tagging: true

      - name: 새 태스크 정의 등록
        id: register
        run: |
          TEMPLATE=$(aws ssm get-parameter --name "$TEMPLATE_PARAM" --query Parameter.Value --output text)
          echo "기준 태스크 정의: ${TEMPLATE##*/}"

          # 이미지만 바꾸고, 등록할 때 쓸 수 없는 조회 전용 필드는 뺀다.
          aws ecs describe-task-definition --task-definition "$TEMPLATE" --query taskDefinition --output json \
            | jq --arg image "$IMAGE" --arg sha "$GITHUB_SHA" '
                .containerDefinitions |= map(if .name == "be" then .image = $image else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)
                | .tags = [
                    {key: "Service", value: "meety"},
                    {key: "Project", value: "meety"},
                    {key: "Version", value: "v2"},
                    {key: "Env", value: "staging"},
                    {key: "ManagedBy", value: "github-actions"},
                    {key: "GitSha", value: $sha}
                  ]' > task-definition.json

          ARN=$(aws ecs register-task-definition --cli-input-json file://task-definition.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "task_definition=$ARN" >> "$GITHUB_OUTPUT"
          echo "::notice::새 태스크 정의: ${ARN##*/}"

      - name: 배포 대기 스크립트 준비
        run: |
          # 서비스 배포를 시작하고, 끝날 조건이 될 때까지 상태를 확인한다.
          # 사용법: deploy.sh <서비스> <태스크 정의> <성공으로 볼 단계(공백 구분)>
          cat > "$RUNNER_TEMP/deploy.sh" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          SERVICE=$1 TASK_DEFINITION=$2 DONE_STAGES=$3
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$TASK_DEFINITION" > /dev/null

          # 이번 update-service로 생긴 배포를 찾는다.
          DEPLOYMENT=""
          for i in $(seq 1 30); do
            DEPLOYMENT=$(aws ecs list-service-deployments --cluster "$CLUSTER" --service "$SERVICE" \
              --created-at "after=$STARTED" --query 'serviceDeployments[0].serviceDeploymentArn' --output text)
            [ "$DEPLOYMENT" != "None" ] && [ -n "$DEPLOYMENT" ] && break
            sleep 5
          done
          [ "$DEPLOYMENT" != "None" ] && [ -n "$DEPLOYMENT" ] || { echo "::error::${SERVICE} 배포를 찾지 못함"; exit 1; }
          echo "${SERVICE} 배포: ${DEPLOYMENT##*/}"

          LAST=""
          while :; do
            read -r STATUS STAGE < <(aws ecs describe-service-deployments --service-deployment-arns "$DEPLOYMENT" \
              --query 'serviceDeployments[0].[status, lifecycleStage]' --output text)
            [ "$STATUS $STAGE" != "$LAST" ] && { echo "$(date +%T) ${SERVICE}: ${STATUS} ${STAGE}"; LAST="$STATUS $STAGE"; }
            case "$STATUS" in
              SUCCESSFUL) exit 0 ;;
              FAILED|STOPPED|STOP_REQUESTED|ROLLBACK_*)
                echo "::error::${SERVICE} 배포 실패 (${STATUS}). ECS가 이전 버전으로 되돌린다"; exit 1 ;;
            esac
            for done_stage in $DONE_STAGES; do
              [ "$STAGE" = "$done_stage" ] && exit 0
            done
            sleep 10
          done
          EOF
          chmod +x "$RUNNER_TEMP/deploy.sh"

      # 같은 job의 배포 잠금을 유지하면서 두 서비스를 동시에 배포한다.
      # realtime은 기존처럼 트래픽 전환까지, API는 롤링 배포 완료까지 기다린다.
      - name: staging realtime 및 API 병렬 배포
        run: |
          "$RUNNER_TEMP/deploy.sh" "$REALTIME_SERVICE" "${{ steps.register.outputs.task_definition }}" "BAKE_TIME CLEAN_UP" &
          REALTIME_PID=$!
          "$RUNNER_TEMP/deploy.sh" "$API_SERVICE" "${{ steps.register.outputs.task_definition }}" "" &
          API_PID=$!

          # 먼저 실패한 서비스가 있어도 나머지 배포 결과를 확인한다.
          # 실패한 서비스는 기존 ECS 롤백 정책을 따르며, 성공한 서비스를 강제로 취소하지 않는다.
          RESULT=0
          if wait "$REALTIME_PID"; then
            echo "${REALTIME_SERVICE} 트래픽 전환 완료"
          else
            echo "::error::${REALTIME_SERVICE} 배포 실패"; RESULT=1
          fi
          if wait "$API_PID"; then
            echo "${API_SERVICE} 롤링 배포 완료"
          else
            echo "::error::${API_SERVICE} 배포 실패"; RESULT=1
          fi
          exit "$RESULT"

      - name: 배포 결과 확인
        # 한쪽이 실패했을 때도 두 서비스의 최종 상태를 로그에 남긴다.
        if: ${{ !cancelled() && steps.register.outcome == 'success' }}
        run: |
          for svc in "$REALTIME_SERVICE" "$API_SERVICE"; do
            echo "$svc: $(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
              --query 'services[0].[runningCount, desiredCount]' --output text)"
          done
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL")
          echo "be-api health: $CODE"
          [ "$CODE" = "200" ] || { echo "::error::be-api health 실패 ($CODE)"; exit 1; }

      - name: Discord 실패 알림
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK_URL" ] || exit 0
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" --arg url "$RUN_URL" \
            '{content: ("❌ [BE V2 staging 배포 실패] " + $repo + "\nBranch: " + $branch + "\n" + $url)}' \
            | curl --fail --silent --show-error -H "Content-Type: application/json" --data-binary @- "$WEBHOOK_URL"

  notify-failure:
    name: BE 실패 알림
    needs: [docker-build, check-migration-label, deploy]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Discord 실패 알림
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 웹훅이 설정된 경우에만 알림을 보낸다.
          [ -n "$WEBHOOK_URL" ] || exit 0
          jq -n \
            --arg repo "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg url "$RUN_URL" \
            '{content: ("❌ [BE CI/CD 실패] " + $repo + "\nBranch: " + $branch + "\n" + $url)}' \
            | curl --fail --silent --show-error \
                -H "Content-Type: application/json" \
                --data-binary @- "$WEBHOOK_URL"
